<html lang="en">

<title>Morning Belle Leaf Race</title>

<style id="css">
:root{
  --bg:#f5f9ef; --panel:#ffffff; --ink:#3c5c68; --text:#4d4d4d; --muted:#6f7c80;
  --line:#dfe8d6; --green:#99c961; --green-deep:#7aa847; --leaf-empty:#e3efd4; --field:#ffffff;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d2b30; --panel:#26383f; --ink:#e7f0e0; --text:#d9e2dc; --muted:#9fb0b2;
    --line:#35505a; --green-deep:#b6dc87; --leaf-empty:#2c4436; --field:#1f3036; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d2b30; --panel:#26383f; --ink:#e7f0e0; --text:#d9e2dc; --muted:#9fb0b2;
  --line:#35505a; --green-deep:#b6dc87; --leaf-empty:#2c4436; --field:#1f3036; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Figtree","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:2rem 1.25rem 3rem}
.top{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:2rem;align-items:center}
@media (max-width:760px){.top{grid-template-columns:1fr;gap:1rem}}
.brand{color:var(--green-deep);font-weight:700;letter-spacing:.02em}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;color:var(--ink);font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.02;margin:.4rem 0 .8rem}
.lede{max-width:44ch;margin:0;font-size:1.05rem}

.leafbox{max-width:560px;width:100%;margin:0 auto}
.leaf{width:100%;height:auto;display:block}
.leaf-empty{fill:var(--leaf-empty)}
.leaf-line{fill:none;stroke:var(--green-deep);stroke-width:1.2;stroke-linejoin:round}
.bands{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(var(--d))}to{transform:none}}
@media (prefers-reduced-motion:reduce){.bands{animation:none}}
.lead-line{fill:none;stroke:var(--muted);stroke-width:.6}
.lead-dot{fill:var(--ink)}
.level-line{stroke:var(--bg);stroke-width:1.2}
.tip-l{font:700 8px "Figtree",Arial,sans-serif;fill:var(--green-deep)}
.lead-name{font:700 8px "Figtree",Arial,sans-serif;fill:var(--ink)}
.lead-amt{font:600 7.5px "Figtree",Arial,sans-serif;fill:var(--muted);font-variant-numeric:tabular-nums}
.ahead{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1.6rem}

.goal{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:16px;padding:.9rem 1.1rem}

.block{border-radius:18px;padding:1rem 1rem 1.1rem;color:#24363d;position:relative}
.block.c-1002{color:#fff}
.block.won{outline:4px solid var(--yellow);outline-offset:3px}
.block .place{font-size:.85rem;font-weight:700;opacity:.85;margin:0}
.block h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:1.4rem;line-height:1.1;margin:.2rem 0 .3rem}
.block .amt{font-size:1.55rem;font-weight:700;margin:0;font-variant-numeric:tabular-nums}
.block .togo{margin:0;font-weight:600;font-size:.95rem}

.meter i{display:block;height:100%;background:currentColor;border-radius:99px}

label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:.3rem}

.empty{color:var(--muted);margin:.5rem 0 0}

  var ranked=R.slice().sort(function(a,b){return t[b.id].total-t[a.id].total});
  var place={},labels=["1st","2nd","3rd","4th"];
  ranked.forEach(function(r,i){if(t[r.id].total>0)place[r.id]=labels[i]});
  var combined=0;R.forEach(function(r){combined+=t[r.id].total});

  var html='<div class="wrap"><div class="top"><div>'+
    '<div class="brand">Morning Belle</div>'+
    '<h1>The Leaf Race</h1>'+
    '<p class="lede">Each restaurant’s catering and events sales raise its own level in the leaf. The tip is '+usd(GOAL)+'. First to reach it wins.</p>'+
    '<p class="combined">'+usd(combined)+'</p>'+
    '<p class="combined-l">Combined catering and events sales. Standings as of '+asOf()+'.</p>';
  if(win)html+='<div class="banner" role="status">'+esc(byId(win).name)+' reached '+usd(GOAL)+' first. The race is won.</div>';
  html+='</div><div class="leafbox">'+leafSVG(ranked,t)+'</div></div>';

  html+='<div class="blocks">';
  ranked.forEach(function(r){
    var x=t[r.id],isWin=win===r.id,pct=Math.min(100,x.total/GOAL*100);
    var togo=isWin?"First to "+usd(GOAL):x.total>=GOAL?"Hit "+usd(GOAL):usd(GOAL-x.total)+" to go";
    html+='<article class="block c-'+r.id+(isWin?' won':'')+'">'+
      '<p class="place">'+(place[r.id]||"Not started")+'</p>'+
      '<h2>'+esc(r.name)+'</h2>'+
      '<p class="amt">'+usd(x.total)+'</p>'+
      '<p class="togo">'+togo+'</p>'+
      '<div class="meter" role="img" aria-label="'+Math.round(pct)+' percent of '+usd(GOAL)+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
    '</article>';
  });
  html+='</div>';

  html+='<section class="ahead" aria-labelledby="aheadh"><h3 id="aheadh">Look ahead</h3><div class="ahead-row">'+
    '<div class="goal"><p class="goal-m">November goal</p><p class="goal-v">$5,000</p></div>'+
    '<div class="goal"><p class="goal-m">December goal</p><p class="goal-v">$7,000</p></div>'+
  '</div><p class="ahead-note">Each restaurant’s catering and events target for the month.</p></section>';
  html+='</div>';
  document.getElementById("root").innerHTML=html;
}
render();
})();
</script>
</body>
</html>
