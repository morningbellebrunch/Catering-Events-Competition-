<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f0f5f0">
<meta name="color-scheme" content="light dark">
<title>Morning Belle | Leaf Race</title>
<!-- Morning Belle Starter Kit v3.1. Single page tool, so no dock. -->
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('mb-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  var c = t === 'dark' ? '#0b1a20' : '#f0f5f0';
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* ===== 1. TOKENS ===== */
  :root {
    --mb-green:#99C961; --mb-coral:#fc826d; --mb-teal:#3c5c68; --mb-pinkberry:#d70158;
    --mb-yellow:#ffde5c; --mb-amber:#fbaf41; --mb-sage:#9bc4bc; --mb-charcoal:#4d4d4d; --mb-orange:#f46e3b;

    --ink:rgba(28,48,58,0.95); --ink-soft:rgba(50,80,92,0.62); --ink-faint:rgba(60,92,104,0.42); --hairline:rgba(60,92,104,0.14);

    --ease-spring:cubic-bezier(0.34,1.56,0.64,1); --ease-out:cubic-bezier(0.22,1,0.36,1); --ease-liquid:cubic-bezier(0.16,1.1,0.3,1);

    --mx:50%; --my:30%;
    --glass-tint:rgba(255,255,255,0.10);
    --glass-blur:blur(7px) saturate(230%) brightness(1.1) contrast(1.06);
    --glass-blur-lg:blur(34px) saturate(200%) brightness(1.1) contrast(1.03);
    --glass-blur-hover:blur(9px) saturate(240%) brightness(1.2) contrast(1.08);
    --surface:transparent;
    --label:rgba(35,60,72,0.82);
    --label-shadow:0 1px 3px rgba(255,255,255,0.7);
    --header-glass:linear-gradient(180deg,rgba(255,255,255,0.55),rgba(255,255,255,0.22));
    --card-glass:linear-gradient(168deg,rgba(255,255,255,0.5) 0%,rgba(255,255,255,0.14) 40%,rgba(255,255,255,0.06) 70%,rgba(255,255,255,0.2) 100%);
    --hero-em:linear-gradient(120deg,#5a8a2a,#3c5c68);
    --specular:0.85;
    --tint-alpha:0.62; --tint-base:0.16;
    --drop:rgba(40,70,84,0.12);
    --lens-rim:conic-gradient(from 205deg,rgba(255,255,255,1) 0%,rgba(255,255,255,0.95) 10%,rgba(155,196,188,0.6) 20%,rgba(60,92,104,0.26) 32%,rgba(60,92,104,0.3) 46%,rgba(153,201,97,0.45) 58%,rgba(255,255,255,0.8) 68%,rgba(255,222,92,0.45) 78%,rgba(255,255,255,1) 88%,rgba(255,255,255,1) 100%);
    --glass-edge:
      inset 0 0 0 1px rgba(255,255,255,0.5),
      inset 0 2px 1px -1px rgba(255,255,255,1),
      inset 0 -2px 2px -1px rgba(255,255,255,0.75),
      inset 3px 0 6px -3px rgba(255,255,255,0.8),
      inset -3px 0 6px -3px rgba(255,255,255,0.8),
      inset 0 -9px 14px -10px rgba(60,92,104,0.5),
      inset 0 9px 14px -10px rgba(60,92,104,0.28);
  }
  html[data-theme="dark"] {
    --ink:rgba(238,246,248,0.96); --ink-soft:rgba(210,228,232,0.70); --ink-faint:rgba(200,220,226,0.48); --hairline:rgba(255,255,255,0.14);
    --glass-tint:rgba(255,255,255,0.05);
    --glass-blur:blur(7px) saturate(160%) brightness(0.92) contrast(1.05);
    --glass-blur-lg:blur(34px) saturate(150%) brightness(0.9) contrast(1.02);
    --glass-blur-hover:blur(9px) saturate(175%) brightness(1.02) contrast(1.06);
    --surface:rgba(9,20,25,0.55);
    --label:rgba(225,238,242,0.88);
    --label-shadow:0 1px 3px rgba(0,0,0,0.55);
    --header-glass:linear-gradient(180deg,rgba(13,28,34,0.74),rgba(13,28,34,0.46));
    --card-glass:linear-gradient(170deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0.03) 45%,rgba(255,255,255,0.06) 100%);
    --hero-em:linear-gradient(120deg,#b9e08a,#9bc4bc);
    --specular:0.32;
    --tint-alpha:0.7; --tint-base:0.2;
    --drop:rgba(0,0,0,0.38);
    --lens-rim:conic-gradient(from 205deg,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0.45) 10%,rgba(155,196,188,0.35) 20%,rgba(0,0,0,0.25) 32%,rgba(0,0,0,0.3) 46%,rgba(153,201,97,0.3) 58%,rgba(255,255,255,0.35) 68%,rgba(255,222,92,0.25) 78%,rgba(255,255,255,0.55) 88%,rgba(255,255,255,0.55) 100%);
    --glass-edge:
      inset 0 0 0 1px rgba(255,255,255,0.14),
      inset 0 2px 1px -1px rgba(255,255,255,0.5),
      inset 0 -2px 2px -1px rgba(255,255,255,0.16),
      inset 3px 0 6px -3px rgba(255,255,255,0.2),
      inset -3px 0 6px -3px rgba(255,255,255,0.2),
      inset 0 -9px 14px -10px rgba(0,0,0,0.55),
      inset 0 9px 14px -10px rgba(0,0,0,0.3);
  }

  /* ===== 2. BASE + LAYERS ===== */
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { background-color:#f0f5f0; color-scheme:light; -webkit-text-size-adjust:100%; }
  html[data-theme="dark"] { background-color:#0b1a20; color-scheme:dark; }
  body { background-color:#f0f5f0; isolation:isolate; } /* body owns the stacking context so the canvas and orbs paint above its background */
  html[data-theme="dark"] body { background-color:#0b1a20; }
  body { font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden; color:var(--ink); -webkit-font-smoothing:antialiased; }
  ::selection { background:rgba(153,201,97,0.35); }
  :focus-visible { outline:2px solid var(--mb-teal); outline-offset:3px; }

  .bg-canvas { position:fixed; top:0; left:0; right:0; height:100vh; height:100lvh; z-index:-3;
    background:linear-gradient(160deg,#f0f5f0 0%,#e8f2f4 35%,#f5f7ee 70%,#faf8f0 100%); }
  html[data-theme="dark"] .bg-canvas { background:
    radial-gradient(1200px 900px at 12% -10%,#17323c 0%,transparent 60%),
    radial-gradient(1000px 800px at 92% 8%,#14282f 0%,transparent 62%),
    linear-gradient(180deg,#0d1c22 0%,#0a1418 55%,#0b1a20 100%); }
  .bg-grain { position:fixed; top:0; left:0; right:0; height:100vh; height:100lvh; z-index:-1; pointer-events:none; opacity:0.5;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='0.035'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
  html[data-theme="dark"] .bg-grain { opacity:0.25; }

  .orb { position:fixed; border-radius:50%; filter:blur(52px); z-index:-2; will-change:top,left; }
  .orb1 { width:520px; height:520px; background:radial-gradient(circle,#99C961 0%,transparent 70%); opacity:0.8; animation:roam1 12s ease-in-out infinite; }
  .orb2 { width:440px; height:440px; background:radial-gradient(circle,#3c5c68 0%,transparent 70%); opacity:0.6; animation:roam2 15s ease-in-out infinite; }
  .orb3 { width:400px; height:400px; background:radial-gradient(circle,#fbaf41 0%,transparent 70%); opacity:0.55; animation:roam3 11s ease-in-out infinite; }
  .orb4 { width:340px; height:340px; background:radial-gradient(circle,#fc826d 0%,transparent 70%); opacity:0.5; animation:roam4 13s ease-in-out infinite; }
  .orb5 { width:300px; height:300px; background:radial-gradient(circle,#9bc4bc 0%,transparent 70%); opacity:0.45; animation:roam5 14s ease-in-out infinite; }
  html[data-theme="dark"] .orb1 { opacity:0.30; } html[data-theme="dark"] .orb2 { opacity:0.45; }
  html[data-theme="dark"] .orb3 { opacity:0.20; } html[data-theme="dark"] .orb4 { opacity:0.18; } html[data-theme="dark"] .orb5 { opacity:0.22; }
  @keyframes roam1 { 0%,100%{top:-10vh;left:-8vw} 25%{top:20vh;left:55vw} 50%{top:60vh;left:15vw} 75%{top:30vh;left:75vw} }
  @keyframes roam2 { 0%,100%{top:10vh;left:70vw} 25%{top:55vh;left:30vw} 50%{top:5vh;left:10vw} 75%{top:70vh;left:65vw} }
  @keyframes roam3 { 0%,100%{top:65vh;left:5vw} 25%{top:10vh;left:40vw} 50%{top:50vh;left:70vw} 75%{top:80vh;left:25vw} }
  @keyframes roam4 { 0%,100%{top:75vh;left:60vw} 25%{top:20vh;left:80vw} 50%{top:45vh;left:20vw} 75%{top:10vh;left:50vw} }
  @keyframes roam5 { 0%,100%{top:40vh;left:40vw} 25%{top:70vh;left:10vw} 50%{top:15vh;left:65vw} 75%{top:55vh;left:50vw} }

  @keyframes riseIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .rise { opacity:0; animation:riseIn 0.7s var(--ease-out) forwards; }
  .d1{animation-delay:.05s} .d2{animation-delay:.14s} .d3{animation-delay:.23s} .d4{animation-delay:.32s} .d5{animation-delay:.41s} .d6{animation-delay:.5s} .d7{animation-delay:.59s}

  /* Shared lens rim */
  .glass::after {
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1.4px; background:var(--lens-rim);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:0.8; pointer-events:none; z-index:4;
  }

  /* ===== 3. HEADER + THEME SWITCH ===== */
  .site-header { position:sticky; top:0; z-index:300; isolation:isolate; padding-top:env(safe-area-inset-top,0px); }
  .site-header::before { content:''; position:absolute; inset:0; z-index:-1; background:var(--header-glass);
    backdrop-filter:blur(28px) saturate(210%) brightness(1.12); -webkit-backdrop-filter:blur(28px) saturate(210%) brightness(1.12);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.95),inset 0 -1px 2px rgba(255,255,255,0.4),0 6px 24px rgba(40,70,84,0.07); opacity:var(--hp,0); }
  html[data-theme="dark"] .site-header::before { box-shadow:inset 0 1px 1px rgba(255,255,255,0.12),inset 0 -1px 2px rgba(0,0,0,0.3),0 6px 24px rgba(0,0,0,0.35); }
  .header-inner { max-width:860px; margin:0 auto; padding:0 1.25rem; display:flex; align-items:center; gap:12px; height:58px; }
  .header-name { font-family:'Playfair Display',serif; font-size:17px; font-weight:600; line-height:1.15; }
  .header-sub { font-size:9px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.22em; margin-top:1px; }
  .rainbow-bar { height:3px; opacity:calc(0.25 + var(--hp,0) * 0.75);
    background:linear-gradient(90deg,#99C961,#ffde5c,#fbaf41,#fc826d,#f46e3b,#3c5c68,#99C961,#ffde5c,#fbaf41,#fc826d,#f46e3b,#3c5c68,#99C961);
    background-size:200% 100%; animation:rainbowFlow 4s linear infinite; }
  @keyframes rainbowFlow { to{background-position:200% 0} }

  .theme-switch { margin-left:auto; display:flex; align-items:center; min-height:44px; border:none; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .theme-track { position:relative; isolation:isolate; width:64px; height:32px; border-radius:999px; display:flex; align-items:center; justify-content:space-between; padding:0 9px; color:var(--ink-faint);
    background:linear-gradient(170deg,rgba(255,255,255,0.45),rgba(255,255,255,0.10)),var(--glass-tint);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur); box-shadow:var(--glass-edge),0 4px 12px rgba(40,70,84,0.10); transition:transform .16s var(--ease-out); }
  .theme-track svg { width:14px; height:14px; position:relative; z-index:1; transition:color .3s ease; }
  .theme-knob { position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:999px; z-index:0;
    background:linear-gradient(170deg,rgba(255,255,255,0.95),rgba(255,255,255,0.55)),rgba(255,222,92,0.35);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,1),inset 0 -2px 3px rgba(251,175,65,0.25),0 3px 8px rgba(40,70,84,0.22);
    transition:left .5s var(--ease-liquid),width .25s var(--ease-liquid),background .4s ease; }
  .theme-switch:active .theme-knob { width:32px; }
  .theme-switch:active .theme-track { transform:scale(0.95); }
  .theme-switch:focus-visible { outline:none; }
  .theme-switch:focus-visible .theme-track { outline:2px solid var(--mb-teal); outline-offset:3px; }
  .theme-track .i-sun { color:#c9851c; }
  html[data-theme="dark"] .theme-track .i-sun { color:var(--ink-faint); }
  html[data-theme="dark"] .theme-track .i-moon { color:#dbe8ff; }
  html[data-theme="dark"] .theme-knob { left:35px; background:linear-gradient(170deg,rgba(255,255,255,0.28),rgba(255,255,255,0.06)),rgba(60,92,104,0.85);
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,0.35),0 3px 10px rgba(0,0,0,0.45); }
  html[data-theme="dark"] .theme-switch:active .theme-knob { left:29px; }

  /* ===== HUB PILL ===== */
  .hub-back { display:flex; align-items:center; min-height:44px; flex-shrink:0; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  .hub-pill { position:relative; isolation:isolate; display:flex; align-items:center; gap:3px; height:32px; padding:0 13px 0 8px; border-radius:999px;
    font-size:12.5px; font-weight:700; letter-spacing:.01em; color:var(--ink);
    background:linear-gradient(170deg,rgba(255,255,255,0.45),rgba(255,255,255,0.10)),var(--glass-tint);
    backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    box-shadow:var(--glass-edge),0 4px 12px rgba(40,70,84,0.10);
    transition:transform .42s var(--ease-liquid); }
  .hub-pill svg { width:16px; height:16px; color:var(--mb-green); transition:transform .42s var(--ease-liquid); }
  html[data-theme="dark"] .hub-pill { background:rgba(255,255,255,0.08); }
  html[data-theme="dark"] .hub-pill svg { color:#b9e08a; }
  .hub-back:hover .hub-pill svg { transform:translateX(-3px); }
  .hub-back:active .hub-pill { transform:scale(.92); transition-duration:.16s; }
  .hub-back:focus-visible { outline:none; }
  .hub-back:focus-visible .hub-pill { outline:2px solid var(--mb-teal); outline-offset:3px; }

  /* ===== 4. PAGE + HERO ===== */
  .page-wrap { max-width:860px; margin:0 auto; padding:1.25rem 1.25rem calc(48px + env(safe-area-inset-bottom,0px)); }
  .hero { text-align:center; padding:2rem 1rem 1.2rem; }
  .hero-headline { font-family:'Playfair Display',serif; font-size:clamp(28px,5.2vw,44px); font-weight:600; line-height:1.12; letter-spacing:-0.01em; margin-bottom:.55rem;
    text-shadow:0 2px 24px rgba(255,255,255,0.5); transform-origin:50% 0;
    transform:translateY(calc(var(--hp,0) * -18px)) scale(calc(1 - var(--hp,0) * 0.14)); opacity:calc(1 - var(--hp,0) * 1.15); }
  html[data-theme="dark"] .hero-headline { text-shadow:0 2px 20px rgba(0,0,0,0.4); }
  .hero-headline em { font-style:italic; font-weight:500; background:var(--hero-em); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .hero-sub { font-size:13px; font-weight:500; color:var(--ink-soft); letter-spacing:.03em; max-width:480px; margin:0 auto; line-height:1.55;
    opacity:calc(1 - var(--hp,0) * 1.6); transform:translateY(calc(var(--hp,0) * -22px)); }

  /* ===== 5. COMPONENTS ===== */
  .section-label { display:flex; align-items:center; gap:10px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.22em; color:var(--ink-faint);
    margin:2.1rem 0 1.2rem; scroll-margin-top:calc(76px + env(safe-area-inset-top,0px)); }
  .section-label::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--dot,var(--mb-green)); box-shadow:0 0 8px var(--dot,var(--mb-green)); }
  .section-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--hairline),transparent); }
  .dot-green{--dot:#99C961} .dot-yellow{--dot:#ffde5c} .dot-sage{--dot:#9bc4bc} .dot-pinkberry{--dot:#d70158} .dot-teal{--dot:#3c5c68} .dot-amber{--dot:#fbaf41} .dot-coral{--dot:#fc826d}

  .glass { position:relative; isolation:isolate; border-radius:22px; padding:1.4rem 1.5rem; margin-bottom:1.1rem;
    background:var(--card-glass),var(--surface);
    backdrop-filter:var(--glass-blur-lg); -webkit-backdrop-filter:var(--glass-blur-lg);
    box-shadow:var(--glass-edge),0 20px 44px var(--drop),0 4px 14px rgba(40,70,84,0.07); }
  .glass::after { opacity:.55; padding:1.3px; }
  .glass::before { content:''; position:absolute; inset:0; border-radius:inherit; z-index:-1; pointer-events:none; opacity:0; transition:opacity .3s ease;
    background:radial-gradient(260px 180px at var(--mx) var(--my),rgba(255,255,255,var(--specular)) 0%,rgba(255,255,255,0.12) 30%,rgba(255,255,255,0) 64%); }
  .glass:hover::before { opacity:.45; }
  .eyebrow { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.16em; color:var(--mb-teal); margin-bottom:.35rem; }
  html[data-theme="dark"] .eyebrow { color:var(--mb-sage); }

  .callout { border-radius:16px; padding:1rem 1.15rem; margin-bottom:1.1rem; background:rgba(153,201,97,.12); border:1px solid rgba(153,201,97,.32); }
  .callout b { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#5a8a2a; margin-bottom:4px; }
  html[data-theme="dark"] .callout b { color:#b9e08a; }
  .callout p { font-size:12.5px; line-height:1.55; color:var(--ink-soft); }

  .footer { text-align:center; padding:2rem 0 0; font-size:10.5px; color:var(--ink-faint); }


  /* ===== LEAF RACE ===== */
  .race-card { padding:1.3rem 1.2rem 1.1rem; }
  .leafbox svg { margin-top:.4rem; }
  .total-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:.4rem; }
  .total { font-family:'Playfair Display',serif; font-size:34px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
  .total-sub { font-size:12px; font-weight:500; color:var(--ink-soft); }
  .leafbox { max-width:560px; margin:0 auto; }
  .leaf { width:100%; height:auto; display:block; overflow:visible; }
  .leaf-empty { fill:rgba(153,201,97,0.20); }
  html[data-theme="dark"] .leaf-empty { fill:rgba(153,201,97,0.14); }
  .level-line { stroke:#f0f5f0; stroke-width:1.2; }
  html[data-theme="dark"] .level-line { stroke:#0b1a20; }
  .bands { animation:levelRise 1.6s var(--ease-out) .3s both; }
  @keyframes levelRise { from{transform:translateY(var(--d))} to{transform:none} }
  .lead-line { fill:none; stroke:var(--ink-faint); stroke-width:.6; }
  .lead-dot { fill:var(--ink); }
  .lead-name { font:700 10px 'DM Sans',sans-serif; fill:var(--ink); }
  .lead-amt { font:500 8.6px 'DM Sans',sans-serif; fill:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .tip-l { font:700 9px 'DM Sans',sans-serif; fill:#5a8a2a; }
  html[data-theme="dark"] .tip-l { fill:#b9e08a; }
  .f-1001{fill:#fc826d} .f-1002{fill:#3c5c68} .f-1003{fill:#fbaf41} .f-1004{fill:#9bc4bc}
  html[data-theme="dark"] .f-1002{fill:#6ea5b6}

  .race-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; }
  .tile { --tint:153,201,97; position:relative; isolation:isolate; border-radius:22px; padding:1rem 1rem 1.05rem;
    background:
      linear-gradient(168deg,rgba(255,255,255,0.46) 0%,rgba(255,255,255,0.10) 34%,rgba(255,255,255,0) 56%,rgba(255,255,255,0.16) 100%),
      radial-gradient(130% 80% at 50% 108%,rgba(var(--tint),var(--tint-alpha)) 0%,rgba(var(--tint),0) 78%),
      linear-gradient(rgba(var(--tint),var(--tint-base)),rgba(var(--tint),var(--tint-base))),
      var(--surface);

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.glass, .tile').forEach(function (el) {
    el.addEventListener('pointermove', function (e) {
      var r = el.getBoundingClientRect();
      el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
    el.addEventListener('pointerleave', function () { el.style.setProperty('--mx', '50%'); el.style.setProperty('--my', '25%'); });
  });
})();

/* Header collapse (single page tool, no dock) */
(function () {
  var root = document.documentElement;
  function hp() { root.style.setProperty('--hp', Math.min(Math.max(window.scrollY / 140, 0), 1).toFixed(3)); }
  window.addEventListener('scroll', function () { requestAnimationFrame(hp); }, { passive: true });
  hp();
})();

/* Hub pill: step back if we came from the hub, otherwise open it fresh */
(function () {
  var HUB = 'https://morningbellebrunch.github.io/manager-hub/';
  var a = document.getElementById('hubBack');
  if (!a) return;
  a.href = HUB;
  a.addEventListener('click', function (e) {
    var ref = document.referrer || '';
    if (ref.indexOf(HUB) === 0 && history.length > 1) { e.preventDefault(); history.back(); }
  });
})();
</script>
</body>
</html>
